name: Cloud Build and Compile
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Compile Frontend Dash
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          PORT=3000 BASE_PATH=/ pnpm --filter clause-risk-interceptor run build
      - name: Package Clean Production Files
        uses: actions/upload-artifact@v4
        with:
          name: compiled-frontend
          path: artifacts/clause-risk-interceptor/dist/
